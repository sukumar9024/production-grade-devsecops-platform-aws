global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [127.0.0.1:9093]
scrape_configs:
  - job_name: readiness
    metrics_path: /probe
    params: {module: [http_ready]}
    static_configs:
      - targets: [http://127.0.0.1:8080/health/ready]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: '127.0.0.1:9115'}
  - job_name: backend
    file_sd_configs:
      - files: [/etc/prometheus/targets/backend.json]
        refresh_interval: 10s
  - job_name: node
    static_configs:
      - targets: [127.0.0.1:9100]
  - job_name: containers
    static_configs:
      - targets: [127.0.0.1:8085]
  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]

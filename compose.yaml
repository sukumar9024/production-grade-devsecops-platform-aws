name: secureops-platform

x-app: &app
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: secureops
      POSTGRES_DB: secureops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init-local.py}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend_network]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U secureops -d secureops"]
      interval: 5s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "1", memory: 512M}
        reservations: {memory: 128M}

  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run python3 scripts/init-local.py}
    command: [sh, -ec, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis_data:/data]
    networks: [backend_network]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {memory: 64M}

  migrate:
    build: ./backend
    image: secureops-backend:local
    command: [sh, -ec, "alembic upgrade head && python -m scripts.seed_roles"]
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://secureops:${POSTGRES_PASSWORD}@postgres:5432/secureops
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Run python3 scripts/init-local.py}
      ENVIRONMENT: local
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173
    networks: [backend_network]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  backend:
    <<: *app
    build: ./backend
    image: secureops-backend:local
    environment: *backend_env
    read_only: true
    tmpfs: [/tmp]
    networks: [backend_network, monitoring_network]
    depends_on:
      migrate: {condition: service_completed_successfully}
    deploy:
      resources:
        limits: {cpus: "1", memory: 512M}
        reservations: {memory: 128M}

  frontend:
    <<: *app
    build: ./frontend
    image: secureops-frontend:local
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    networks: [frontend_network, backend_network]
    depends_on:
      backend: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
        reservations: {memory: 32M}

  nginx:
    <<: *app
    image: nginxinc/nginx-unprivileged:1.28-alpine
    ports: ["127.0.0.1:${APP_PORT:-8080}:8080"]
    read_only: true
    tmpfs: [/tmp]
    volumes: [./docker/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [frontend_network]
    depends_on:
      frontend: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/health/live"]
      interval: 10s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
        reservations: {memory: 32M}

networks:
  frontend_network:
  backend_network:
    internal: true
  monitoring_network:
    internal: true

volumes:
  postgres_data:
  redis_data:

# On private EC2, only ALB may reach port 8080. Replace CIDRs if VPC changes.
set_real_ip_from 10.20.0.0/16;
set_real_ip_from 10.30.0.0/16;
set_real_ip_from 10.40.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
log_format json escape=json '{"timestamp":"$time_iso8601","service":"nginx","request_id":"$request_id","method":"$request_method","endpoint":"$uri","status_code":$status}';
server {
    listen 8080;
    server_tokens off;
    access_log /dev/stdout json;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /metrics { return 404; }
    location ~ ^/api/v1/auth/(login|refresh|register|token|password-reset)$ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://active_slot;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://active_slot;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

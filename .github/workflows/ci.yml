name: CI

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16.10-alpine

        env:
          POSTGRES_USER: secureops
          POSTGRES_PASSWORD: secureops_test_password
          POSTGRES_DB: secureops_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U secureops -d secureops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_NAME: SecureOps API
      APP_VERSION: 1.0.0
      ENVIRONMENT: test
      DEBUG: "false"

      DATABASE_URL: postgresql+psycopg://secureops:secureops_test_password@localhost:5432/secureops_test
      TEST_DATABASE_URL: postgresql+psycopg://secureops:secureops_test_password@localhost:5432/secureops_test
      # Disposable CI service only. AWS Redis requires AUTH and TLS.
      REDIS_URL: redis://localhost:6379/0

      JWT_SECRET: github-actions-test-secret-not-for-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7

      LOG_LEVEL: INFO

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint backend
        run: python -m ruff check .

      - name: Verify ORM models
        run: python -m scripts.check_models

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run backend tests
        run: python -m pytest -v --junitxml=../reports/backend-tests.xml

      - name: Save backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: reports/backend-tests.xml
          if-no-files-found: warn


  frontend:
    name: Frontend Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Save frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  platform:
    name: Deployment and security gate tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Validate deployment failure handling
        run: python -m unittest discover -s tests/platform -v
      - name: Check operational script syntax
        run: |
          python -m compileall -q scripts infrastructure/ansible/files
          for file in scripts/*.sh; do bash -n "$file"; done

# Keep syntax compatible with security scanners while running Python 3.14.
target-version = "py313"
line-length = 88

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
ignore = ["B904"]

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "app.dependencies.rbac.require_roles"]

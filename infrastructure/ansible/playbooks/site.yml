---
- name: Configure SecureOps private application hosts through SSM
  hosts: role_app
  become: true
  serial: 1
  vars:
    repository_root: "{{ playbook_dir }}/../../.."
    secureops_root: /opt/secureops
  pre_tasks:
    - name: Require SSM transfer bucket
      ansible.builtin.assert:
        that:
          - ansible_aws_ssm_bucket_name | length > 0
          - ansible_aws_ssm_bucket_sse_kms_key_id | length > 0
        fail_msg: Set ANSIBLE_SSM_BUCKET to the Terraform bootstrap transfer bucket.
  roles:
    - base
    - docker
    - hardening
    - app
    - monitoring
    - logging

---
- name: Configure and start private monitoring and signed log ingestion
  hosts: role_app
  become: true
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  vars:
    secureops_root: /opt/secureops
  tasks:
    - name: Retrieve notification and Grafana credentials on the host and start observability
      ansible.builtin.command:
        argv:
          - /usr/bin/python3.11
          - "{{ secureops_root }}/scripts/deploy-release.py"
          - --root
          - "{{ secureops_root }}"
          - --observability
      no_log: true
      changed_when: true
